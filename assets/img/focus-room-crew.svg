         <rect x="-14" y="52" width="30" height="2" fill="#00A19C"></rect><rect x="17" y="46" width="2" height="30" fill="#00A19C"></rect>
         <rect x="-5" y="64" width="4" height="40" fill="#555b66"></rect><ellipse cx="-3" cy="62" rx="20" ry="5" fill="#3a3f48"></ellipse>
