<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="t">Meet the crew</title><desc id="d">A backstory card over Rocco Marchetti, the chief mechanic behind the coffee bar.</desc><defs><linearGradient id="dimGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset=".6" stop-color="#000" stop-opacity="0"/></linearGradient></defs><style>.steam path{fill:none;stroke:rgba(255,255,255,.22);stroke-width:3;stroke-linecap:round}#car{transform:translateX(1100px)}.figure.on .kit{filter:url(#hostGlow)}</style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1015"></stop><stop offset="1" stop-color="#171b22"></stop></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22262e"></stop><stop offset="1" stop-color="#101216"></stop></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050913"></stop><stop offset=".75" stop-color="#0c1a3d"></stop><stop offset="1" stop-color="#1b2a52"></stop></linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd9a8" stop-opacity=".28"></stop><stop offset="1" stop-color="#ffd9a8" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="screenPool" cx=".5" cy="0" r=".8"><stop offset="0" stop-color="#5a86ff" stop-opacity=".18"></stop><stop offset="1" stop-color="#5a86ff" stop-opacity="0"></stop></radialGradient>
    <filter id="hostGlow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fff" flood-opacity=".45"></feDropShadow></filter>
  </defs>

  <g id="backdrop">
