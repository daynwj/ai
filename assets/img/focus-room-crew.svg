      <rect x="14" y="16" width="10" height="12" rx="2" fill="#f2f2f2"></rect></g><g class="figure" data-id="giulia" transform="translate(600 520)"><rect x="-14" y="44" width="11" height="76" rx="4" fill="#C0C5CC"></rect><rect x="3" y="44" width="11" height="76" rx="4" fill="#C0C5CC"></rect>
