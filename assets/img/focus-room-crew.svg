      <line x1="840" y1="0" x2="840" y2="640"></line><line x1="1120" y1="0" x2="1120" y2="640"></line>
    </g>
    <g fill="#e9eef7" opacity=".55"><rect x="150" y="18" width="220" height="5" rx="2"></rect><rect x="690" y="18" width="220" height="5" rx="2"></rect><rect x="1100" y="18" width="200" height="5" rx="2"></rect></g>

    <!-- team banner: red, blue, thin teal line -->
