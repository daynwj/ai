      <circle cx="0" cy="-22" r="15" fill="#c9a98a"></circle><path d="M-15 -26 Q 0 -44 15 -26 Z" fill="#2a2220"></path>
      <rect x="14" y="16" width="10" height="12" rx="2" fill="#f2f2f2"></rect></g><g class="figure" data-id="theo" transform="translate(250 560)"><rect x="-16" y="44" width="34" height="11" rx="4" fill="#C0C5CC"></rect><rect x="10" y="44" width="10" height="34" rx="4" fill="#C0C5CC"></rect>
