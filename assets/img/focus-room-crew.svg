    </g>
    <rect x="320" y="360" width="200" height="6" fill="#2b3038"></rect>
    <g fill="#2f3640"><rect x="332" y="330" width="26" height="30" rx="4"></rect><rect x="368" y="322" width="26" height="38" rx="4"></rect><rect x="404" y="334" width="26" height="26" rx="4"></rect></g>
  </g>

