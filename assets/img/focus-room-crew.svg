         <rect x="-14" y="52" width="30" height="2" fill="#00A19C"></rect><rect x="17" y="46" width="2" height="30" fill="#00A19C"></rect>
         <rect x="-5" y="64" width="4" height="40" fill="#555b66"></rect><ellipse cx="-3" cy="62" rx="20" ry="5" fill="#3a3f48"></ellipse>
      <g class="kit"><rect x="-20" y="-6" width="40" height="54" rx="14" fill="#D40000"></rect>
      <rect x="-20" y="14" width="40" height="5" fill="#0033A0" opacity=".9"></rect></g>
      <circle cx="0" cy="-22" r="15" fill="#c9a98a"></circle><path d="M-15 -26 Q 0 -44 15 -26 Z" fill="#2a2220"></path>
      <rect x="14" y="16" width="10" height="12" rx="2" fill="#f2f2f2"></rect></g><g class="figure" data-id="luca" transform="translate(410 560)"><rect x="-16" y="44" width="34" height="11" rx="4" fill="#C0C5CC"></rect><rect x="10" y="44" width="10" height="34" rx="4" fill="#C0C5CC"></rect>
