  <g class="steam" transform="translate(150 330)"><path d="M0 40 C -8 28, 8 18, 0 4"></path><path d="M22 40 C 14 28, 30 18, 22 4"></path><path d="M44 40 C 36 28, 52 18, 44 4"></path></g>

  <!-- the car: parked off-screen right, drives into the bay at session end -->
  <g id="car"><g transform="translate(560 716)">
    <ellipse cx="250" cy="92" rx="270" ry="10" fill="#000" opacity=".45"></ellipse>
    <rect x="0" y="6" width="34" height="8" fill="#0033A0"></rect><rect x="14" y="14" width="8" height="36" fill="#222"></rect>
    <path d="M8 66 L40 50 L170 44 L230 26 L300 24 L330 42 L470 46 L520 58 L520 72 L8 74 Z" fill="#D40000"></path>
    <path d="M40 60 L470 60 L470 64 L40 66 Z" fill="#0033A0"></path>
    <path d="M60 55 L460 53 L460 55.5 L60 57.5 Z" fill="#00A19C"></path>
    <path d="M232 28 Q 265 6 300 26" fill="none" stroke="#C0C5CC" stroke-width="6"></path>
    <rect x="490" y="70" width="44" height="6" fill="#111"></rect>
    <g fill="#0d0d0f" stroke="#2a2a2e" stroke-width="4"><circle cx="96" cy="72" r="30"></circle><circle cx="420" cy="72" r="30"></circle></g>
    <g fill="#C0C5CC"><circle cx="96" cy="72" r="6"></circle><circle cx="420" cy="72" r="6"></circle></g>
  </g></g>
<text x="800" y="40" font-size="13" fill="#A9B0BC" font-weight="600" text-anchor="middle" letter-spacing="2.6">YOUR ONE TASK</text><text x="800" y="104" font-size="60" fill="#F4F5F7" font-weight="700" text-anchor="middle">Outline the onboarding emails</text><rect x="520" y="124" width="560" height="46" rx="10" fill="rgba(10,12,16,.8)" stroke="#00A19C" stroke-width="2"/><text x="540" y="153" font-size="17" fill="#F4F5F7" font-weight="400" text-anchor="start">Outline the onboarding emails</text><rect x="1222" y="500" width="356" height="384" rx="16" fill="#0d0f14" stroke="rgba(255,255,255,.14)"/><circle cx="1279" cy="560" r="32" fill="none" stroke="#252a33" stroke-width="6"/><circle cx="1279" cy="560" r="32" fill="none" stroke="#D40000" stroke-width="6"/><rect x="1330" y="532" width="62" height="20" rx="6" fill="#2a2f38"/><text x="1361" y="546" font-size="11" fill="#A9B0BC" font-weight="700" text-anchor="middle" letter-spacing="1.3">READY</text><text x="1330" y="588" font-size="34" fill="#F4F5F7" font-weight="700" text-anchor="start">30:00</text><text x="1242" y="628" font-size="13.5" fill="#A9B0BC" font-weight="400" text-anchor="start">30 minutes on, 5 off. The crew stays quiet</text><text x="1242" y="647" font-size="13.5" fill="#A9B0BC" font-weight="400" text-anchor="start">until the car comes in.</text><rect x="1242" y="664" width="316" height="40" rx="10" fill="#D40000" stroke="#D40000"/><text x="1400.0" y="689.0" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Start focus</text><path d="M1242 722 H1558" stroke="rgba(255,255,255,.14)"/><text x="1242" y="750" font-size="13.5" fill="#A9B0BC" font-weight="400" text-anchor="start">Lo-fi music</text><text x="1558" y="750" font-size="13.5" fill="#F4F5F7" font-weight="600" text-anchor="end">45%</text><rect x="1242" y="764" width="316" height="6" rx="3" fill="#2a2f38"/><rect x="1242" y="764" width="142.20000000000002" height="6" rx="3" fill="#00A19C"/><circle cx="1384.2" cy="767" r="8" fill="#00A19C"/><text x="1242" y="808" font-size="13.5" fill="#A9B0BC" font-weight="400" text-anchor="start">Garage café</text><text x="1558" y="808" font-size="13.5" fill="#F4F5F7" font-weight="600" text-anchor="end">25%</text><rect x="1242" y="822" width="316" height="6" rx="3" fill="#2a2f38"/><rect x="1242" y="822" width="79.0" height="6" rx="3" fill="#00A19C"/><circle cx="1321.0" cy="825" r="8" fill="#00A19C"/><path d="M1242 842 H1558" stroke="rgba(255,255,255,.14)"/><text x="1242" y="868" font-size="13.5" fill="#A9B0BC" font-weight="400" text-anchor="start">Scratch pad: empty</text><text x="1558" y="868" font-size="13.5" fill="#3FD6CF" font-weight="400" text-anchor="end">Open scratch pad</text><path d="M1450 872 H1558" stroke="#3FD6CF"/><rect x="330" y="214" width="300" height="150" rx="10" fill="#0d0f14" stroke="rgba(255,255,255,.14)"/><path d="M340 214 H620" stroke="#00A19C" stroke-width="3"/><text x="344" y="242" font-size="16" fill="#F4F5F7" font-weight="700" text-anchor="start">Rocco Marchetti</text><text x="344" y="261" font-size="12.5" fill="#A9B0BC" font-weight="400" text-anchor="start">Chief Mechanic</text><text x="344" y="286" font-size="13.5" fill="#F4F5F7" font-weight="400" text-anchor="start">Twenty-five years of wheel guns and late</text><text x="344" y="305" font-size="13.5" fill="#F4F5F7" font-weight="400" text-anchor="start">nights, from a village outside Parma. Runs</text><text x="344" y="324" font-size="13.5" fill="#F4F5F7" font-weight="400" text-anchor="start">the pit crew, and nobody else touches the</text><text x="344" y="343" font-size="13.5" fill="#F4F5F7" font-weight="400" text-anchor="start">espresso machine.</text><path d="M471.0 364 L480.0 376 L489.0 364" fill="#0d0f14" stroke="rgba(255,255,255,.14)"/></svg>