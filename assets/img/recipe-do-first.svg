<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="t">A Do First phase</title><desc id="d">A card phase labeled Do First for making the sauce, with ingredient amounts repeated inside the step text.</desc><rect width="900" height="616" fill="#1A1613"/><rect x="8" y="8" width="884" height="600" rx="18" fill="#221C18" stroke="#3A322B"/><rect x="30" y="30" width="128" height="46" rx="23" fill="rgba(221,102,64,.14)" stroke="#DD6640" stroke-width="1.5"/><text x="94" y="60" font-size="17" fill="#DD6640" font-weight="700" text-anchor="middle" letter-spacing="1.4">DO FIRST</text><text x="180" y="50" font-size="23" fill="#E8DCC8" font-weight="600" text-anchor="start">Make the Sauce</text><text x="180" y="76" font-size="17" fill="#A99A85" font-weight="400" text-anchor="start">Holds at room temp</text><text x="30" y="124" font-size="16" fill="#A99A85" font-weight="600" text-anchor="start" letter-spacing="1.4">INGREDIENTS</text><rect x="30" y="146" width="36" height="36" rx="8" fill="none" stroke="#8a7d6c" stroke-width="2"/><text x="84" y="172" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="700">2 tbsp</tspan><tspan font-weight="400"> hoisin sauce</tspan></text><rect x="30" y="214" width="36" height="36" rx="8" fill="none" stroke="#8a7d6c" stroke-width="2"/><text x="84" y="240" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="700">1 tsp</tspan><tspan font-weight="400"> sugar</tspan></text><rect x="30" y="282" width="36" height="36" rx="8" fill="none" stroke="#8a7d6c" stroke-width="2"/><text x="84" y="308" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="700">½ tsp</tspan><tspan font-weight="400"> crushed red pepper</tspan></text><rect x="30" y="350" width="36" height="36" rx="8" fill="none" stroke="#8a7d6c" stroke-width="2"/><text x="84" y="376" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="700">2 tsp</tspan><tspan font-weight="400"> low-sodium soy sauce</tspan></text><text x="30" y="442" font-size="16" fill="#A99A85" font-weight="600" text-anchor="start" letter-spacing="1.4">STEPS</text><rect x="30" y="464" width="36" height="36" rx="8" fill="none" stroke="#8a7d6c" stroke-width="2"/><text x="84" y="490" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="400">Whisk </tspan><tspan font-weight="700">2 tbsp</tspan><tspan font-weight="400"> hoisin, </tspan><tspan font-weight="700">1 tsp</tspan><tspan font-weight="400"> sugar, </tspan><tspan font-weight="700">½ tsp</tspan><tspan font-weight="400"> crushed red pepper, and </tspan><tspan font-weight="700">2</tspan></text><text x="84" y="524" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="700">tsp</tspan><tspan font-weight="400"> soy sauce in a small bowl. Set aside — it holds at room temp until</tspan></text><text x="84" y="558" font-size="21" fill="#E8DCC8" font-weight="400" text-anchor="start">you need it for the finish.</text></svg>