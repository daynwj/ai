<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 206" width="900" height="206" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="t">The fork point</title><desc id="d">A callout with a solid left accent bar reading fork point, this is critical, explaining when to pull the mild portion.</desc><rect width="900" height="206" fill="#1A1613"/><rect x="8" y="10" width="884" height="186" rx="14" fill="#2f211b" stroke="#4a342a"/><rect x="8" y="10" width="7" height="186" rx="3" fill="#DD6640"/><text x="40" y="54" font-size="17" fill="#DD6640" font-weight="700" text-anchor="start" letter-spacing="1.3">FORK POINT: THIS IS CRITICAL</text><text x="40" y="94" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="700">After browning the pork and softening the beans — before the sauce</tspan></text><text x="40" y="128" font-size="21" fill="#E8DCC8" text-anchor="start"><tspan font-weight="700">goes in</tspan><tspan font-weight="400"> — pull the mild portion into a separate bowl or onto plates. The</tspan></text><text x="40" y="162" font-size="21" fill="#E8DCC8" font-weight="400" text-anchor="start">full-spiced version stays in the skillet for the sauce.</text></svg>