<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1108" width="760" height="1108" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="t">A full recipe card built by Haiku</title><desc id="d">A full recipe card for pulled pork and vinegar potato salad, showing a Do First phase and a numbered prep and sear phase.</desc><rect width="760" height="1108" fill="#1A1613"/><rect width="760" height="1108" fill="#1e1a17"/><rect width="760" height="146" fill="#141110"/><rect y="144" width="760" height="2" fill="#D9875F"/><text x="28" y="70" font-size="33" fill="#F3ECE2" font-weight="700" text-anchor="start">Pulled Pork &amp; Vinegar Potato Salad</text><text x="28" y="112" font-size="18" fill="#A99A85" font-weight="400" text-anchor="start">2 hours total | Instant Pot + stovetop</text><rect x="28" y="172" width="704" height="70" rx="10" fill="#141110" stroke="#332c26"/><rect x="48" y="194" width="94" height="26" rx="13" fill="#C9A96E"/><text x="95" y="212" font-size="13" fill="#141110" font-weight="800" text-anchor="middle" letter-spacing="1">DO FIRST</text><text x="158" y="214" font-size="19" fill="#F3ECE2" font-weight="700" text-anchor="start">Vinegar Potato Salad</text><path d="M690 200 h18 l-9 14z" fill="#E8DCC8"/><rect x="28" y="268" width="704" height="840" rx="10" fill="#2a2420" stroke="#332c26"/><rect x="28" y="268" width="704" height="78" rx="10" fill="#141110"/><circle cx="66" cy="307" r="17" fill="#D9875F"/><text x="66" y="313" font-size="16" fill="#141110" font-weight="700" text-anchor="middle">1</text><text x="98" y="313" font-size="20" fill="#F3ECE2" font-weight="700" text-anchor="start">Prep &amp; Sear Pork</text><path d="M690 300 h18 l-9 14z" fill="#E8DCC8"/><rect x="48" y="364" width="664" height="210" rx="6" fill="#3a302a"/><text x="64" y="397" font-size="15" fill="#C9A96E" font-weight="700" text-anchor="start" letter-spacing="1.2">FOR THIS PHASE:</text><text x="64" y="438" font-size="17" fill="#EDE6DC" font-weight="400" text-anchor="start">3 lb pork roast, cubed</text><text x="64" y="474" font-size="17" fill="#EDE6DC" font-weight="400" text-anchor="start">1 Tbsp brown sugar, 2 tsp paprika, 2 tsp garlic powder, 2 tsp onion powder</text><text x="64" y="510" font-size="17" fill="#EDE6DC" font-weight="400" text-anchor="start">1 tsp salt, 1 tsp pepper, ½ tsp cumin</text><text x="64" y="546" font-size="17" fill="#EDE6DC" font-weight="400" text-anchor="start">2 Tbsp olive oil</text><rect x="68" y="612" width="30" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="118" y="630" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">Mix the dry rub: combine 1 Tbsp brown sugar, 2 tsp paprika, 2 tsp</text><text x="118" y="660" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">garlic powder, 2 tsp onion powder, 1 tsp salt, 1 tsp pepper, and ½</text><text x="118" y="690" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">tsp cumin in a small bowl.</text><path d="M48 728 H712" stroke="#3a322b"/><rect x="68" y="774" width="30" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="118" y="792" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">Season the pork cubes generously with the spice rub, tossing to</text><text x="118" y="822" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">coat evenly.</text><path d="M48 860 H712" stroke="#3a322b"/><rect x="68" y="906" width="30" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="118" y="924" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">Set Instant Pot to sauté mode. Add 2 Tbsp olive oil and let heat</text><text x="118" y="954" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">until shimmering.</text><path d="M48 992 H712" stroke="#3a322b"/><rect x="68" y="1038" width="30" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="118" y="1056" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">Working in batches to avoid crowding, sear pork until browned on</text><text x="118" y="1086" font-size="18" fill="#EDE6DC" font-weight="400" text-anchor="start">2–3 sides (2–3 minutes per batch). Transfer to a plate.</text></svg>