<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="t">Phases and the gaps between them</title><desc id="d">Numbered cooking phases with green bars between them describing what to do while the rice cooks unattended.</desc><rect width="900" height="470" fill="#1A1613"/><rect x="8" y="8" width="884" height="86" rx="16" fill="#221C18" stroke="#3A322B"/><circle cx="54" cy="51" r="24" fill="#2e2722"/><text x="54" y="58" font-size="20" fill="#E8DCC8" font-weight="700" text-anchor="middle">1</text><text x="98" y="46" font-size="23" fill="#E8DCC8" font-weight="600" text-anchor="start">Start Rice &amp; Prep</text><text x="98" y="72" font-size="17" fill="#A99A85" font-weight="400" text-anchor="start">Rice cooks unattended for 20 min</text><path d="M858 48 l6 3 -6 3z" fill="#A99A85"/><rect x="8" y="110" width="884" height="66" rx="10" fill="#26201b"/><rect x="8" y="110" width="4" height="66" rx="2" fill="#9DB06A"/><text x="32" y="150" font-size="19" fill="#A99A85" font-weight="400" text-anchor="start">Rice is at pressure for ~20 min. Once it finishes and rests, move to the next phase.</text><rect x="8" y="192" width="884" height="86" rx="16" fill="#221C18" stroke="#3A322B"/><circle cx="54" cy="235" r="24" fill="#2e2722"/><text x="54" y="242" font-size="20" fill="#E8DCC8" font-weight="700" text-anchor="middle">2</text><text x="98" y="230" font-size="23" fill="#E8DCC8" font-weight="600" text-anchor="start">Brown Pork &amp; Soften Beans</text><text x="98" y="256" font-size="17" fill="#A99A85" font-weight="400" text-anchor="start">3–4 min cooking</text><path d="M858 232 l6 3 -6 3z" fill="#A99A85"/><rect x="8" y="294" width="884" height="66" rx="10" fill="#26201b"/><rect x="8" y="294" width="4" height="66" rx="2" fill="#9DB06A"/><text x="32" y="334" font-size="19" fill="#A99A85" font-weight="400" text-anchor="start">Remaining beans are softening — perfect time to get plates out and fluff the rice.</text><rect x="8" y="376" width="884" height="86" rx="16" fill="#221C18" stroke="#3A322B"/><circle cx="54" cy="419" r="24" fill="#2e2722"/><text x="54" y="426" font-size="20" fill="#E8DCC8" font-weight="700" text-anchor="middle">3</text><text x="98" y="414" font-size="23" fill="#E8DCC8" font-weight="600" text-anchor="start">Finish (Spiced Portion)</text><text x="98" y="440" font-size="17" fill="#A99A85" font-weight="400" text-anchor="start">1–2 min</text><path d="M858 416 l6 3 -6 3z" fill="#A99A85"/></svg>