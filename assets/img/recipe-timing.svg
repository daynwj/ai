<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="t">Timing chips</title><desc id="d">Four timing chips reading prep 10 to 15 minutes, cook 10 to 15 minutes, rice 20 minutes, total 30 to 35 minutes.</desc><rect width="900" height="96" fill="#1A1613"/><rect x="10" y="12" width="212" height="72" rx="12" fill="#2b2420"/><text x="116" y="38" font-size="16" fill="#A99A85" font-weight="400" text-anchor="middle">Prep</text><text x="116" y="68" font-size="21" fill="#E8DCC8" font-weight="700" text-anchor="middle">10–15 min</text><rect x="232" y="12" width="212" height="72" rx="12" fill="#2b2420"/><text x="338" y="38" font-size="16" fill="#A99A85" font-weight="400" text-anchor="middle">Cook</text><text x="338" y="68" font-size="21" fill="#E8DCC8" font-weight="700" text-anchor="middle">10–15 min</text><rect x="454" y="12" width="212" height="72" rx="12" fill="#2b2420"/><text x="560" y="38" font-size="16" fill="#A99A85" font-weight="400" text-anchor="middle">Rice</text><text x="560" y="68" font-size="21" fill="#E8DCC8" font-weight="700" text-anchor="middle">20 min</text><rect x="676" y="12" width="212" height="72" rx="12" fill="#2b2420"/><text x="782" y="38" font-size="16" fill="#A99A85" font-weight="400" text-anchor="middle">Total</text><text x="782" y="68" font-size="21" fill="#E8DCC8" font-weight="700" text-anchor="middle">30–35 min</text></svg>