<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Four people or groups, from my son to more than fifty CSMs. For each, what I designed ahead of time and what they own while using it. Each step to the right, I have less say over their week.">
  <rect width="1000" height="470" fill="#FFFFFF"/>
  <text x="60" y="58" font-size="11" font-weight="700" fill="#5B6066" letter-spacing="0.6">THE SAME CONVERSATION, FOUR TIMES</text>
  <text x="60" y="84" font-size="17" font-weight="700" fill="#14161A">I set up the conversation. They say what they want.</text>
  <line x1="60" y1="112" x2="930" y2="112" stroke="#14161A" stroke-width="1.4"/>
  <path d="M930 106 L942 112 L930 118 Z" fill="#14161A"/>
  <text x="60" y="104" font-size="11.5" fill="#5B6066">Closer to home</text>
  <text x="940" y="104" font-size="11.5" fill="#5B6066" text-anchor="end">Less say over their week</text>

  <g font-size="13" font-weight="700" fill="#FFFFFF">
    <rect x="60" y="132" width="200" height="40" fill="#0033A0"/><text x="160" y="157" text-anchor="middle">My son</text>
    <rect x="283" y="132" width="200" height="40" fill="#0033A0"/><text x="383" y="157" text-anchor="middle">My wife</text>
    <rect x="506" y="132" width="200" height="40" fill="#0033A0"/><text x="606" y="157" text-anchor="middle">A teacher friend</text>
    <rect x="729" y="132" width="211" height="40" fill="#E10600"/><text x="834" y="157" text-anchor="middle">50+ CSMs at work</text>
  </g>

  <g font-size="11" font-weight="700" fill="#5B6066" letter-spacing="0.4">
    <text x="60" y="198">I SET UP</text><text x="283" y="198">I SET UP</text><text x="506" y="198">I SET UP</text><text x="729" y="198">I SET UP</text>
    <text x="60" y="318">IN THEIR WORDS</text><text x="283" y="318">IN THEIR WORDS</text><text x="506" y="318">IN THEIR WORDS</text><text x="729" y="318">IN THEIR WORDS</text>
  </g>
  <g fill="#F4F5F7" stroke="#E4E6EA">
    <rect x="60" y="208" width="200" height="86"/><rect x="283" y="208" width="200" height="86"/><rect x="506" y="208" width="200" height="86"/><rect x="729" y="208" width="211" height="86"/>
  </g>
  <g fill="#FFFFFF" stroke="#14161A" stroke-width="1.2">
    <rect x="60" y="328" width="200" height="74"/><rect x="283" y="328" width="200" height="74"/><rect x="506" y="328" width="200" height="74" stroke="#E4E6EA"/><rect x="729" y="328" width="211" height="74"/>
  </g>
  <g font-size="12.4" fill="#14161A">
    <text x="74" y="232"><tspan x="74" dy="0">A script of leading</tspan><tspan x="74" dy="19">questions, drafted</tspan><tspan x="74" dy="19">with Claude</tspan></text>
    <text x="297" y="232"><tspan x="297" dy="0">Short sessions, ordered</tspan><tspan x="297" dy="19">by relief</tspan><tspan x="297" dy="19">An interview script</tspan></text>
    <text x="520" y="232"><tspan x="520" dy="0">An interview guide,</tspan><tspan x="520" dy="19">ready when he is</tspan></text>
    <text x="743" y="232"><tspan x="743" dy="0">100/200/300 levels</tspan><tspan x="743" dy="19">An interview prompt</tspan><tspan x="743" dy="19">A weekly AMA</tspan></text>

    <text x="74" y="352"><tspan x="74" dy="0">His own rules, starting</tspan><tspan x="74" dy="19">with "admit when you</tspan><tspan x="74" dy="19">don't know"</tspan></text>
    <text x="297" y="352"><tspan x="297" dy="0">Her own rules, and her</tspan><tspan x="297" dy="19">projects, built by talking</tspan></text>
    <text x="520" y="352" fill="#5B6066" font-style="italic"><tspan x="520" dy="0">Not started yet</tspan></text>
    <text x="743" y="352"><tspan x="743" dy="0">Their custom instructions,</tspan><tspan x="743" dy="19">reviewed and saved</tspan><tspan x="743" dy="19">by each CSM</tspan></text>
  </g>
  <text x="60" y="440" font-size="12.4" fill="#5B6066">Each step to the right, the conversation works the same way and my authority shrinks. The last column is where I'm still learning.</text>
</svg>
