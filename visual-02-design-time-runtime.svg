<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Diagram contrasting heavy design-time architecture with light rule-driven runtime" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="700" fill="#FFFFFF"/>

  <text x="60" y="44" font-size="11.5" font-weight="700" fill="#E10600" letter-spacing="1.4">DESIGN TIME — DO THIS ONCE, AND DO IT HARD</text>
  <text x="672" y="44" font-size="11.5" font-weight="700" fill="#E10600" letter-spacing="1.4">RUNTIME</text>

  <!-- instructions -->
  <rect x="60" y="62" width="288" height="266" fill="#F4F6F8" stroke="#0033A0" stroke-width="2"/>
  <rect x="60" y="62" width="288" height="5" fill="#0033A0"/>
  <text x="84" y="102" font-size="17" font-weight="700" fill="#14161A">The instructions</text>
  <text x="84" y="124" font-size="11.5" font-weight="700" fill="#0033A0" letter-spacing="0.4">ONLY WHAT NEVER CHANGES</text>
  <text x="84" y="158" font-size="13" fill="#2b2e33">
    <tspan x="84" dy="0">How the system works</tspan>
    <tspan x="84" dy="24">Where to go to look things up</tspan>
    <tspan x="84" dy="24">The rules it can't break</tspan>
    <tspan x="84" dy="24">What to do when it's unsure</tspan>
  </text>
  <line x1="84" y1="258" x2="324" y2="258" stroke="#D8DCE2" stroke-width="1"/>
  <text x="84" y="284" font-size="12.4" fill="#5B6066" font-style="italic">
    <tspan x="84" dy="0">Store the date of birth once.</tspan>
    <tspan x="84" dy="18">Calculate the age every time.</tspan>
  </text>

  <!-- grounding -->
  <rect x="360" y="62" width="288" height="266" fill="#F4F6F8" stroke="#0033A0" stroke-width="2"/>
  <rect x="360" y="62" width="288" height="5" fill="#0033A0"/>
  <text x="384" y="102" font-size="17" font-weight="700" fill="#14161A">The grounding source</text>
  <text x="384" y="124" font-size="11.5" font-weight="700" fill="#0033A0" letter-spacing="0.4">EVERYTHING THAT MOVES</text>
  <text x="384" y="158" font-size="13" fill="#2b2e33">
    <tspan x="384" dy="0">Facts that go stale</tspan>
    <tspan x="384" dy="24">Preferences that shift</tspan>
    <tspan x="384" dy="24">Anything I'd otherwise edit</tspan>
    <tspan x="384" dy="24">The system writes here too</tspan>
  </text>
  <line x1="384" y1="258" x2="624" y2="258" stroke="#D8DCE2" stroke-width="1"/>
  <text x="384" y="284" font-size="12.4" fill="#5B6066" font-style="italic">
    <tspan x="384" dy="0">Notion for me. SharePoint at work.</tspan>
    <tspan x="384" dy="18">Drive if you're on Gemini.</tspan>
  </text>

  <!-- runtime -->
  <rect x="672" y="62" width="268" height="266" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="2"/>
  <text x="696" y="102" font-size="17" font-weight="700" fill="#14161A">Look up. Decide.</text>
  <text x="696" y="124" font-size="11.5" font-weight="700" fill="#5B6066" letter-spacing="0.4">THE EASY PART, EVERY TIME</text>
  <text x="696" y="158" font-size="13" fill="#5B6066">
    <tspan x="696" dy="0">There is still reasoning here.</tspan>
    <tspan x="696" dy="24">The difference is that the</tspan>
    <tspan x="696" dy="24">rules already decided it.</tspan>
  </text>
  <line x1="696" y1="258" x2="916" y2="258" stroke="#E4E6EA" stroke-width="1"/>
  <text x="696" y="284" font-size="12.4" font-weight="600" fill="#0033A0">
    <tspan x="696" dy="0">Applying a decision, not making</tspan>
    <tspan x="696" dy="18">a fresh one and hoping.</tspan>
  </text>

  <!-- logic band -->
  <rect x="60" y="344" width="588" height="44" fill="#0033A0"/>
  <text x="354" y="372" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Together, these two supply the logic.</text>

  <!-- payoff -->
  <rect x="60" y="418" width="880" height="60" fill="#E10600"/>
  <text x="500" y="455" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">The harder you work at design time, the lighter the model you need at runtime.</text>

  <!-- instances -->
  <text x="60" y="522" font-size="11.5" font-weight="700" fill="#E10600" letter-spacing="1.4">THE SAME SHAPE, TWICE</text>

  <rect x="60" y="540" width="425" height="140" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1.5"/>
  <rect x="60" y="540" width="4" height="140" fill="#0033A0"/>
  <text x="84" y="570" font-size="14.5" font-weight="700" fill="#14161A">Henry Schein One</text>
  <text x="84" y="595" font-size="12.6" fill="#5B6066">
    <tspan x="84" dy="0">A Copilot prompt re-reasoned the whole business</tspan>
    <tspan x="84" dy="18">review on every run, so the output drifted. Rebuilt</tspan>
    <tspan x="84" dy="18">with BI as a Domo dashboard — enter an account,</tspan>
    <tspan x="84" dy="18">get the same complete script every time.</tspan>
  </text>
  <text x="84" y="668" font-size="12.5" font-weight="700" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">60+ min  →  15–30 min</text>

  <rect x="515" y="540" width="425" height="140" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1.5"/>
  <rect x="515" y="540" width="4" height="140" fill="#0033A0"/>
  <text x="539" y="570" font-size="14.5" font-weight="700" fill="#14161A">Digital Sous Chef</text>
  <text x="539" y="595" font-size="12.6" fill="#5B6066">
    <tspan x="539" dy="0">A few hours of back-and-forth on the heavy model</tspan>
    <tspan x="539" dy="18">to design the skill, write the rules, and break it</tspan>
    <tspan x="539" dy="18">enough times to trust it. That horsepower got spent</tspan>
    <tspan x="539" dy="18">once. Cards get built on the light model now.</tspan>
  </text>
  <text x="539" y="668" font-size="12.5" font-weight="700" fill="#E10600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Design heavy  →  run light</text>
</svg>
