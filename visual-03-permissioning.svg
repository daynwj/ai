<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Two permissioning outcomes: an agent that shipped as designed at Recorded Future, and one that was blocked and rerouted at Henry Schein One" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="700" fill="#FFFFFF"/>

  <text x="60" y="44" font-size="11.5" font-weight="700" fill="#E10600" letter-spacing="1.4">TWO ORGS, TWO ANSWERS — AND THE ANSWER SHAPED THE ARCHITECTURE BOTH TIMES</text>

  <!-- ===== LEFT ===== -->
  <rect x="60" y="64" width="418" height="558" fill="#F4F6F8" stroke="#0033A0" stroke-width="2"/>
  <rect x="60" y="64" width="418" height="6" fill="#0033A0"/>

  <text x="86" y="104" font-size="18" font-weight="700" fill="#14161A">Recorded Future</text>
  <text x="86" y="126" font-size="11.5" font-weight="700" fill="#0033A0" letter-spacing="0.6">SHIPPED AS DESIGNED</text>
  <text x="86" y="150" font-size="12.4" fill="#5B6066">Gainsight's Slack AI agent, to the whole CSM team.</text>
  <line x1="86" y1="172" x2="452" y2="172" stroke="#D8DCE2" stroke-width="1"/>

  <text x="86" y="202" font-size="11" font-weight="700" fill="#5B6066" letter-spacing="0.8">WHO SEES WHAT</text>
  <rect x="86" y="216" width="366" height="50" fill="#FFFFFF" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="86" y="216" width="4" height="50" fill="#0033A0"/>
  <text x="106" y="238" font-size="13.5" font-weight="600" fill="#14161A">CSM</text>
  <text x="106" y="256" font-size="12.3" fill="#5B6066">Their own book. Nothing else.</text>

  <rect x="86" y="276" width="366" height="50" fill="#FFFFFF" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="86" y="276" width="4" height="50" fill="#0033A0"/>
  <text x="106" y="298" font-size="13.5" font-weight="600" fill="#14161A">Manager</text>
  <text x="106" y="316" font-size="12.3" fill="#5B6066">Whatever rolls up to them.</text>

  <text x="86" y="362" font-size="11" font-weight="700" fill="#5B6066" letter-spacing="0.8">WHERE IT'S ENFORCED</text>
  <rect x="86" y="376" width="366" height="56" fill="#FFFFFF" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="86" y="376" width="4" height="56" fill="#E10600"/>
  <text x="106" y="398" font-size="13" font-weight="600" fill="#14161A">Inherited from Salesforce</text>
  <text x="106" y="418" font-size="12.3" fill="#5B6066">No second permission model to maintain.</text>

  <rect x="86" y="442" width="366" height="56" fill="#FFFFFF" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="86" y="442" width="4" height="56" fill="#E10600"/>
  <text x="106" y="464" font-size="13" font-weight="600" fill="#14161A">Confined to DMs by a wildcard operator</text>
  <text x="106" y="484" font-size="12.3" fill="#5B6066">Out of every channel, public and private.</text>

  <line x1="86" y1="524" x2="452" y2="524" stroke="#D8DCE2" stroke-width="1"/>
  <text x="86" y="550" font-size="12.4" fill="#5B6066">
    <tspan x="86" dy="0">Piloted with under ten people first. Clearing legal</tspan>
    <tspan x="86" dy="18">and InfoSec at a threat intelligence company meant</tspan>
    <tspan x="86" dy="18">working with the vendor's own product team.</tspan>
  </text>

  <!-- ===== RIGHT ===== -->
  <rect x="522" y="64" width="418" height="558" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="2"/>
  <rect x="522" y="64" width="418" height="6" fill="#5B6066"/>

  <text x="548" y="104" font-size="18" font-weight="700" fill="#14161A">Henry Schein One</text>
  <text x="548" y="126" font-size="11.5" font-weight="700" fill="#5B6066" letter-spacing="0.6">BLOCKED, THEN REROUTED</text>
  <text x="548" y="150" font-size="12.4" fill="#5B6066">A Copilot Studio agent with a live line into Gainsight.</text>
  <line x1="548" y1="172" x2="914" y2="172" stroke="#E4E6EA" stroke-width="1"/>

  <text x="548" y="202" font-size="11" font-weight="700" fill="#5B6066" letter-spacing="0.8">WHAT I ASKED FOR</text>
  <rect x="548" y="216" width="366" height="50" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1"/>
  <text x="568" y="238" font-size="13.5" font-weight="600" fill="#14161A">MCP or a custom connector</text>
  <text x="568" y="256" font-size="12.3" fill="#5B6066">Live data, mediated through ops.</text>

  <text x="548" y="302" font-size="11" font-weight="700" fill="#5B6066" letter-spacing="0.8">WHAT CAME BACK</text>
  <rect x="548" y="316" width="366" height="50" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1"/>
  <text x="568" y="338" font-size="13.5" font-weight="600" fill="#14161A">No MCP access into Copilot</text>
  <text x="568" y="356" font-size="12.3" fill="#5B6066">Use what a vendor already offers.</text>

  <text x="548" y="402" font-size="11" font-weight="700" fill="#E10600" letter-spacing="0.8">WHAT WE BUILT INSTEAD</text>
  <rect x="548" y="416" width="366" height="66" fill="#F4F6F8" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="548" y="416" width="4" height="66" fill="#E10600"/>
  <text x="568" y="438" font-size="12.8" font-weight="600" fill="#14161A">Account questions → Gainsight's own Copilot</text>
  <text x="568" y="458" font-size="12.3" fill="#5B6066">
    <tspan x="568" dy="0">The vendor agent already reaches that data.</tspan>
    <tspan x="568" dy="16">Nothing to get approved.</tspan>
  </text>

  <rect x="548" y="492" width="366" height="82" fill="#F4F6F8" stroke="#D8DCE2" stroke-width="1"/>
  <rect x="548" y="492" width="4" height="82" fill="#E10600"/>
  <text x="568" y="514" font-size="12.8" font-weight="600" fill="#14161A">Everything else → a SharePoint-grounded agent</text>
  <text x="568" y="534" font-size="12.3" fill="#5B6066">
    <tspan x="568" dy="0">Call recordings, SOPs, knowledge docs, product</tspan>
    <tspan x="568" dy="16">links. Grounded in the Graph, so a CSM searches</tspan>
    <tspan x="568" dy="16">Outlook, Teams and SharePoint in one place.</tspan>
  </text>

  <text x="548" y="600" font-size="12.3" fill="#5B6066" font-style="italic">It can't touch Gainsight or Salesforce. It doesn't need to.</text>

  <!-- footer -->
  <rect x="60" y="646" width="880" height="48" fill="#E10600"/>
  <text x="500" y="676" text-anchor="middle" font-size="15.5" font-weight="600" fill="#FFFFFF">Ask for what you actually want. Then find out what you're allowed to reach.</text>
</svg>
